<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f0d" />
    <meta name="description" content="CarnivalForYou — магически костюми под наем. Венециански маски, фантастични образи, Хелоуин и детски костюми." />

    <!-- OpenGraph defaults (updated dynamically per route by useSEO) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CarnivalForYou" />
    <meta property="og:title" content="CarnivalForYou — Магически костюми под наем" />
    <meta property="og:description" content="Магически костюми под наем в София. Венециански маски, фантастични образи, Хелоуин и детски костюми. Резервирайте на място." />
    <!-- Absolute URLs, not paths: link-preview crawlers (Facebook, WhatsApp,
         Viber, Messenger) don't resolve relative og:image/og:url against the
         page, so a path here yields no preview image at all on every route
         except product pages, which the Cloudflare Function rewrites. -->
    <meta property="og:image" content="https://carnivalforyou.com/og-default.jpg" />
    <meta property="og:url" content="https://carnivalforyou.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CarnivalForYou — Магически костюми под наем" />
    <meta name="twitter:description" content="Магически костюми под наем в София. Венециански маски, фантастични образи, Хелоуин и детски костюми." />
    <meta name="twitter:image" content="https://carnivalforyou.com/og-default.jpg" />

    <!-- Static homepage hreflang pair, additive to the client-side ones
         useSEO.ts sets for every other route — helps non-JS crawlers the
         same way the static OG block above does. -->
    <link rel="alternate" hreflang="bg" href="https://carnivalforyou.com/" />
    <link rel="alternate" hreflang="en" href="https://carnivalforyou.com/en" />
    <link rel="alternate" hreflang="x-default" href="https://carnivalforyou.com/" />

    <!-- Describes the physical shop itself, so search engines and AI
         assistants can answer "where can I rent a carnival costume in Sofia"
         with this business. Static rather than injected by useSEO because
         crawlers that don't run JavaScript are exactly the audience for it;
         the @id lets any page-level schema refer to the same entity instead
         of declaring a second business.
         The address, phone and hours here duplicate site_settings, which is
         what the site itself renders and what the admin panel edits — if
         those change there, update this block in the same commit. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "@id": "https://carnivalforyou.com/#business",
        "name": "CarnivalForYou",
        "alternateName": "Карнавал за теб",
        "url": "https://carnivalforyou.com/",
        "description": "Магазин за карнавални костюми под наем в София — над 1500 костюма за деца и възрастни, венециански маски, перуки, шапки и аксесоари за Хелоуин, Коледа, тематични партита, рождени дни и фотосесии.",
        "image": "https://carnivalforyou.com/og-default.jpg",
        "telephone": "+359888716941",
        "email": "office@carnivalforyou.com",
        "priceRange": "€€",
        "currenciesAccepted": "BGN, EUR",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "ж.к. Младост 4, бл. 426А, вх. В, ет. 1",
          "addressLocality": "София",
          "addressCountry": "BG"
        },
        "areaServed": { "@type": "City", "name": "София" },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Wednesday", "Friday"],
            "opens": "12:00",
            "closes": "18:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "12:00",
            "closes": "14:00"
          }
        ],
        "sameAs": [
          "https://www.instagram.com/carnivalforyou/",
          "https://www.facebook.com/CarnivalForYou"
        ]
      }
    </script>

    <title>CarnivalForYou — Магически костюми под наем</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Henny+Penny&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
