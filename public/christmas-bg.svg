<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf3ff" />
      <stop offset="45%" stop-color="#f7f0e6" />
      <stop offset="100%" stop-color="#fdf6e8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#fff3d0" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#ffe9b8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfeaf7" />
      <stop offset="100%" stop-color="#eef4fb" />
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f2" />
      <stop offset="100%" stop-color="#fbf7ee" />
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefcf7" />
      <stop offset="100%" stop-color="#fffdf9" />
    </linearGradient>

    <!-- Layered pine tree: 3 fringed/scalloped tiers (not a flat triangle) +
         trunk + snow dusting on the branch tips. Tiers use currentColor so
         each <use> instance can pick its own green shade via color="...";
         trunk and snow caps stay fixed regardless of the instance color. -->
    <symbol id="pine" viewBox="0 0 120 200">
      <path d="M52,182 h16 v17 h-16 Z" fill="#5c3a20" />
      <path
        d="M6,182 L24,168 L42,182 L60,168 L78,182 L96,168 L114,182 L60,88 Z"
        fill="currentColor"
      />
      <path
        d="M20,140 L40,128 L60,140 L80,128 L100,140 L60,48 Z"
        fill="currentColor"
      />
      <path
        d="M32,95 L60,85 L88,95 L60,8 Z"
        fill="currentColor"
      />
      <!-- subtle shaded side for a little volume -->
      <path d="M60,88 L114,182 L96,168 L78,182 L60,168 Z" fill="#00160c" opacity="0.12" />
      <path d="M60,48 L100,140 L80,128 L60,140 Z" fill="#00160c" opacity="0.12" />
      <path d="M60,8 L88,95 L60,85 Z" fill="#00160c" opacity="0.12" />
      <!-- snow caps -->
      <g fill="#ffffff" opacity="0.92">
        <ellipse cx="24" cy="167" rx="7" ry="4" />
        <ellipse cx="96" cy="167" rx="7" ry="4" />
        <ellipse cx="40" cy="127" rx="6" ry="3.5" />
        <ellipse cx="80" cy="127" rx="6" ry="3.5" />
        <ellipse cx="60" cy="84" rx="5" ry="3" />
        <ellipse cx="60" cy="8" rx="5.5" ry="4" />
      </g>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />
  <rect width="1600" height="900" fill="url(#glow)" />

  <!-- soft warm bokeh (string-light glow) -->
  <g opacity="0.55">
    <circle cx="230" cy="150" r="34" fill="#ffe6a8" opacity="0.35" />
    <circle cx="1310" cy="120" r="26" fill="#ffe6a8" opacity="0.3" />
    <circle cx="980" cy="200" r="20" fill="#ffd9c2" opacity="0.28" />
    <circle cx="520" cy="90" r="16" fill="#ffe6a8" opacity="0.3" />
  </g>

  <!-- far snowy hills -->
  <path d="M0,560 C220,500 380,540 560,510 C760,478 900,530 1080,500 C1260,472 1420,520 1600,495 L1600,900 L0,900 Z" fill="url(#hillBack)" />

  <!-- pine tree row (back, smaller/paler) -->
  <g opacity="0.38">
    <use href="#pine" x="100" y="480" width="56" height="93" color="#4a7f63" />
    <use href="#pine" x="145" y="465" width="50" height="83" color="#5b8c6e" />
    <use href="#pine" x="245" y="490" width="60" height="100" color="#4a7f63" />
    <use href="#pine" x="615" y="470" width="58" height="97" color="#5b8c6e" />
    <use href="#pine" x="1060" y="465" width="58" height="97" color="#4a7f63" />
    <use href="#pine" x="1340" y="478" width="56" height="93" color="#5b8c6e" />
    <use href="#pine" x="1405" y="492" width="60" height="100" color="#4a7f63" />
  </g>

  <!-- mid snowy hills -->
  <path d="M0,660 C200,610 360,650 540,620 C740,588 920,640 1120,610 C1300,584 1460,630 1600,605 L1600,900 L0,900 Z" fill="url(#hillMid)" />

  <!-- pine tree row (front, larger/richer) -->
  <g opacity="0.62">
    <use href="#pine" x="40" y="586" width="72" height="120" color="#1e5138" />
    <use href="#pine" x="165" y="575" width="80" height="133" color="#2f6b4a" />
    <use href="#pine" x="460" y="588" width="76" height="127" color="#1e5138" />
    <use href="#pine" x="880" y="580" width="82" height="137" color="#2f6b4a" />
    <use href="#pine" x="1160" y="586" width="76" height="127" color="#1e5138" />
    <use href="#pine" x="1425" y="578" width="80" height="133" color="#2f6b4a" />
  </g>

  <!-- foreground snow drift -->
  <path d="M0,760 C240,715 420,760 620,730 C820,700 980,745 1180,715 C1340,690 1480,730 1600,710 L1600,900 L0,900 Z" fill="url(#hillFront)" />

  <!-- soft snow dot texture on foreground drift -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="140" cy="800" r="2.2" />
    <circle cx="340" cy="820" r="1.6" />
    <circle cx="560" cy="790" r="2" />
    <circle cx="760" cy="830" r="1.8" />
    <circle cx="980" cy="800" r="2.4" />
    <circle cx="1180" cy="825" r="1.6" />
    <circle cx="1380" cy="795" r="2" />
    <circle cx="1520" cy="820" r="1.8" />
  </g>
</svg>
